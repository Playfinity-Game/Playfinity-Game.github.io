<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MEGASIZE – Playfinity</title>
<style>
:root{color-scheme:dark;--bg:#080b17;--panel:#10182a;--cyan:#00eaff;--pink:#ff477d;--muted:#98a5bd;--line:#26344d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#172b49 0,#0b1020 43%,var(--bg) 78%);color:#f4f7ff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;padding:0 max(18px,calc((100vw - 1040px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff12;background:#080d1bcc}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}.logo-text{font-size:1.4rem;font-weight:900;letter-spacing:2px;white-space:nowrap;background:linear-gradient(135deg,#00f0ff,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(0,240,255,.35)}
.back-link:hover{color:var(--cyan)}
h1{margin:0;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:2px;font-weight:900}
h1 .mega{color:var(--cyan)}h1 .size{color:var(--pink)}
.scoreline{font-size:.78rem;letter-spacing:1.5px;color:#c2cce0;text-transform:uppercase}
.scoreline b{color:#ffd95b;margin-left:12px}
.wrap{width:min(100% - 28px,920px);margin:22px auto 48px}
.intro{text-align:center;color:#aab5ca;margin:0 0 16px;font-size:.92rem}
.roundline{text-align:center;color:#8794ad;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;margin:0 0 12px}
.roundline strong{color:#f4f7ff}
.toolbar{position:absolute;top:10px;right:10px;z-index:10;display:flex;gap:6px;padding:5px;border:1px solid #ffffff20;border-radius:13px;background:#091222d9;backdrop-filter:blur(8px)}.toolbar button{width:38px;height:36px;padding:0;font-size:1.3rem;line-height:1;border-radius:9px;background:#17243a;border-color:#344866}.toolbar button#resetView{width:36px;font-size:1rem}
button{font:inherit;font-weight:800;border:1px solid #344866;background:#17243a;color:#f4f7ff;border-radius:10px;padding:9px 13px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(110deg,#00d9ef,#168cff);color:#04111e;border:0;padding:12px 26px;box-shadow:0 5px 22px #00bde533}
.board-shell{border:1px solid #2a3a55;border-radius:16px;overflow:hidden;background:#0b1221;box-shadow:0 18px 55px #0006}
.board{height:min(62vh,590px);min-height:360px;position:relative;overflow:hidden;touch-action:none;background-color:#0b1324;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:34px 34px}
.ground{position:absolute;left:0;right:0;bottom:14%;height:2px;background:#627b9e88;box-shadow:0 0 9px #4b79c055}
.world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.obj{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;pointer-events:none;touch-action:none}
.obj svg{display:block;width:100%;height:100%;overflow:visible;fill:currentColor}.obj.png{background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.obj svg *{stroke:currentColor;stroke-linejoin:round;stroke-linecap:round}
.reference{color:#168dff;filter:drop-shadow(0 0 7px #168dff66);z-index:3;pointer-events:none}
.guess{color:var(--pink);filter:drop-shadow(0 0 8px #ff477d66);cursor:grab;pointer-events:auto;touch-action:none}
.guess:active{cursor:grabbing}
.actual{color:#f4f7ff;opacity:.92;filter:drop-shadow(0 0 8px #ffffff30);display:none;z-index:1}
.guess{z-index:2}
.scale-tools{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 12px 10px}.scale-tools span{font-size:.75rem;color:#aab5ca;margin-right:4px}.scale-tools button{min-width:46px;font-size:1.1rem;padding:8px 14px}.meta{display:flex;justify-content:space-between;gap:14px;padding:13px 15px 8px;flex-wrap:wrap}
.meta strong{display:block;font-size:.88rem}
.meta .muted{display:block;color:var(--muted);font-size:.78rem}
.reftext strong{color:#71b7ff}.targettext strong{color:#ff719a}
.dimension{color:#c8d3e8;text-align:right}
.lockrow{display:flex;justify-content:flex-end;padding:10px 15px 15px}
.result{display:none;position:absolute;top:10px;left:10px;z-index:9;width:calc(100% - 112px);max-width:310px;margin:0;padding:11px;border:1px solid #59708f;border-radius:12px;background:linear-gradient(135deg,#101f34f5,#0d1728f5);box-shadow:0 8px 28px #0009;backdrop-filter:blur(8px)}
.result.show{display:block}
.resulttop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.result .points{font-size:2rem;flex:0 0 auto}.result h2{font-size:.9rem}.result p{font-size:.76rem;line-height:1.35}.result .nextrow{margin-top:8px}.result .nextrow button{padding:7px 10px;font-size:.78rem}
.points{font-size:2.5rem;line-height:1;font-weight:950;color:#ffdb57}
.points small{font-size:.9rem;color:#c6d1e5;font-weight:700}
.result h2{font-size:1rem;margin:0 0 5px}
.result p{margin:4px 0;color:#c5d0e2;font-size:.86rem}
.result .nextrow{display:flex;justify-content:flex-end;margin-top:12px}
.hint{text-align:center;color:#7888a4;font-size:.78rem;padding:0 10px;margin-top:12px}
@media(max-width:600px){ .logo-text{font-size:1.08rem;letter-spacing:1px}header{height:58px;padding:0 12px}.wrap{width:calc(100% - 16px);margin:12px auto 24px}.board{height:54svh;min-height:310px;max-height:520px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px 12px 7px}.dimension{text-align:left;grid-column:1/-1;border-top:1px solid #ffffff12;padding-top:7px}.meta strong{font-size:.82rem;overflow-wrap:anywhere}.meta .muted{font-size:.67rem}.lockrow{padding:9px 10px 12px}.lockrow button{width:100%;min-height:46px}.toolbar{top:8px;right:8px;gap:5px;padding:4px}.result{top:8px;left:8px;width:calc(100% - 104px);padding:8px}.result .points{font-size:1.75rem}.result p{font-size:.69rem}.result .resulttop{gap:7px}.toolbar button{width:36px;height:34px;flex:none;padding:0;font-size:1.2rem}.toolbar button#resetView{width:34px;font-size:.95rem}.scale-tools button{min-height:42px}.intro{font-size:.8rem;margin-bottom:12px}.roundline{margin-bottom:8px}.hint{font-size:.7rem;line-height:1.5}}
</style>
</head>
<body>
<header><a class="brand" href="../" aria-label="Playfinity – zurück zur Testzentrale"><div class="logo-text">PLAYFINITY</div></a><h1><span class="mega">MEGA</span><span class="size">SIZE</span></h1><div class="scoreline" id="score">RUNDE 1 / 11 <b>0 PUNKTE</b></div></header>
<main class="wrap">
<div class="roundline">RUNDE <strong id="round">1</strong> / <strong id="roundTotal">11</strong></div>
<section class="board-shell">
<div class="board" id="board"><div class="ground"></div><div class="toolbar" aria-label="Ansicht vergrößern oder verkleinern"><button id="zoomOut" aria-label="Ansicht herauszoomen" title="Verkleinern">−</button><button id="zoomIn" aria-label="Ansicht hineinzoomen" title="Vergrößern">+</button><button id="resetView" aria-label="Ansicht zurücksetzen" title="Ansicht zurücksetzen">↺</button></div><div class="obj reference" id="reference"></div><div class="world" id="world"><div class="obj actual" id="actual"></div><div class="obj guess" id="guess"></div></div><div class="result" id="result"></div></div>
<div class="meta">
<div class="reftext"><strong id="referenceName">Referenz</strong></div>
<div class="targettext"><strong id="targetName">Gesucht</strong></div>
<div class="dimension"><strong id="dimension">HÖHE</strong></div>
</div>
<div class="scale-tools"><span>GRÖSSE DER ROTEN SILHOUETTE</span><button id="objectSmaller" aria-label="Rote Silhouette verkleinern">−</button><button id="objectLarger" aria-label="Rote Silhouette vergrößern">+</button></div><div class="lockrow"><button class="primary" id="lock">Auswerten</button></div>

</section>

</main>
<script src="./data.js?v=11"></script>
<script>
(()=>{
const rounds=window.MEGASIZE_DATA||[];
let index=0,total=0,zoom=1,panX=0,panY=0,locked=false,guessScale=1,guessX=0,guessY=0,base=142,drag=null;
const $=id=>document.getElementById(id),board=$('board'),world=$('world'),ref=$('reference'),guess=$('guess'),actual=$('actual');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function box(item){if(item.w&&item.h)return {w:item.w,h:item.h};const svg=item.svg||'';const m=svg.match(/viewBox=["']\s*([\d.-]+)[ ,]+([\d.-]+)[ ,]+([\d.-]+)[ ,]+([\d.-]+)\s*["']/i);return m?{w:+m[3],h:+m[4]}:{w:1,h:1}}
function sizeFor(item,axisPx){const z=box(item),ratio=z.w/z.h;return {w:axisPx*(ratio>=1?1:ratio),h:axisPx*(ratio>=1?1/ratio:1)}}
function factor(r){const ratio=r.target.value/r.reference.value;return r.dimension==='Fläche'?Math.sqrt(ratio):ratio}
function toMeters(value,unit){if(unit==='cm')return value/100;if(unit==='km')return value*1000;return value}
function formatMeasure(value,unit,dimension){
 const area=dimension==='Fläche',suffix=area?'²':'';
 let meters=toMeters(value,unit),outUnit=unit;
 if(unit==='m'||unit==='cm'||unit==='km'){
  if(Math.abs(meters)>=1000){value=meters/1000;outUnit='km'}
  else if(Math.abs(meters)<1){value=meters*100;outUnit='cm'}
  else{value=meters;outUnit='m'}
 }
 return value.toLocaleString('de-DE',{maximumFractionDigits:2})+' '+outUnit+suffix;
}
function center(){return{x:board.clientWidth/2,y:board.clientHeight*.72}}
function setObj(el,item,s){el.style.width=s.w+'px';el.style.height=s.h+'px';if(item.src){el.innerHTML='';el.classList.add('png');el.style.webkitMaskImage='url('+item.src+')';el.style.maskImage='url('+item.src+')';}else{el.classList.remove('png');el.style.webkitMaskImage='';el.style.maskImage='';el.innerHTML=item.svg||'';}}
function pos(el,x,y){el.style.left=x+'px';el.style.top=y+'px'}
function render(){
 if(!rounds.length)return;
 const r=rounds[index],c=center(),rs=sizeFor(r.reference,base),ts=sizeFor(r.target,base);
 $('referenceName').textContent=r.reference.name;$('targetName').textContent=r.target.name;
 $('dimension').textContent=r.dimension.toUpperCase();
 $('round').textContent=index+1;$('roundTotal').textContent=rounds.length;$('score').innerHTML='RUNDE '+(index+1)+' / '+rounds.length+' <b>'+total+' PUNKTE</b>';
 setObj(ref,r.reference,rs);applyReferenceZoom();
 setObj(guess,r.target,ts);setObj(actual,r.target,ts);guessScale=1;guessX=c.x+25-ts.w/2;guessY=c.y-ts.h;
 locked=false;actual.style.display='none';applyGuess();applyZoom();$('result').classList.remove('show');$('result').innerHTML='';$('lock').disabled=false;
}
function groundWorldY(height){return (board.clientHeight*.86-panY)/zoom-height}
function applyGuess(){const s=sizeFor(rounds[index].target,base),w=s.w*guessScale,h=s.h*guessScale;guess.style.width=w+'px';guess.style.height=h+'px';guessY=groundWorldY(h);pos(guess,guessX,guessY)}
function applyReferenceZoom(){const r=rounds[index];if(!r)return;const rs=sizeFor(r.reference,base);ref.style.transformOrigin='top left';ref.style.transform='none';pos(ref,24,board.clientHeight*.86-rs.h)}
function positionActual(){if(!rounds[index]||actual.style.display==='none')return;const r=rounds[index],trueFactor=factor(r),s=sizeFor(r.target,base),h=s.h*trueFactor,c=center();actual.style.width=s.w*trueFactor+'px';actual.style.height=h+'px';pos(actual,c.x+25-s.w*trueFactor/2,groundWorldY(h))}
function applyZoom(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';applyReferenceZoom();if(rounds[index])applyGuess();if(locked)positionActual()}
function boardPoint(e){const b=board.getBoundingClientRect();return{x:(e.clientX-b.left-panX)/zoom,y:(e.clientY-b.top-panY)/zoom}}
function changeObjectScale(mult){if(locked)return;guessScale=Math.max(.015,Math.min(80,guessScale*mult));applyGuess()}
function animateNumber(el,from,to,duration=950,suffix=''){if(!el)return;const start=performance.now(),delta=to-from;el.textContent=Math.round(from).toLocaleString('de-DE')+suffix;function tick(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3),value=Math.round(from+delta*ease);el.textContent=value.toLocaleString('de-DE')+suffix;if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
$('objectLarger').onclick=()=>changeObjectScale(1.14);$('objectSmaller').onclick=()=>changeObjectScale(1/1.14);
const guessPointers=new Map();let objectPinch=null;
guess.addEventListener('pointerdown',e=>{
 if(locked)return;e.preventDefault();guess.setPointerCapture(e.pointerId);guessPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(guessPointers.size===2){const a=[...guessPointers.values()];objectPinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:guessScale};drag=null;}
 else{const p=boardPoint(e);drag={x:p.x-guessX,y:p.y-guessY};}
});
guess.addEventListener('pointermove',e=>{
 if(!guessPointers.has(e.pointerId)||locked)return;guessPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(guessPointers.size===2&&objectPinch){const a=[...guessPointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);guessScale=Math.max(.015,Math.min(80,objectPinch.scale*d/Math.max(1,objectPinch.distance)));applyGuess();}
 else if(drag){const p=boardPoint(e);guessX=p.x-drag.x;applyGuess();}
});
function endGuessPointer(e){guessPointers.delete(e.pointerId);if(guessPointers.size<2)objectPinch=null;if(guessPointers.size===1){const [id,p]=[...guessPointers.entries()][0],q=boardPoint({clientX:p.x,clientY:p.y});drag={x:q.x-guessX,y:q.y-guessY};}else drag=null;}
guess.addEventListener('pointerup',endGuessPointer);guess.addEventListener('pointercancel',endGuessPointer);
guess.addEventListener('wheel',e=>{if(locked)return;e.preventDefault();changeObjectScale(e.deltaY<0?1.08:.92)},{passive:false});
$('zoomIn').onclick=()=>{zoom=Math.min(40,zoom*1.2);applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(.025,zoom/1.2);applyZoom()};
$('resetView').onclick=()=>{zoom=1;panX=0;panY=0;applyZoom()};
const pointers=new Map();let pinch=null;
board.addEventListener('pointerdown',e=>{
 if(e.target.closest('#guess'))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const a=[...pointers.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom,midX:(a[0].x+a[1].x)/2,midY:(a[0].y+a[1].y)/2,panX,panY};}
});
board.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2&&pinch){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mX=(a[0].x+a[1].x)/2,mY=(a[0].y+a[1].y)/2,next=Math.max(.025,Math.min(40,pinch.zoom*d/Math.max(1,pinch.distance)));const rect=board.getBoundingClientRect(),localX=pinch.midX-rect.left,localY=pinch.midY-rect.top,ratio=next/pinch.zoom;panX=localX-(localX-pinch.panX)*ratio+(mX-pinch.midX);panY=localY-(localY-pinch.panY)*ratio+(mY-pinch.midY);zoom=next;applyZoom();}
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}
board.addEventListener('pointerup',endPointer);board.addEventListener('pointercancel',endPointer);
$('lock').onclick=()=>{
 if(locked)return;
 const r=rounds[index];
 if(!r||!Number.isFinite(r.target.value)||!Number.isFinite(r.reference.value)||r.reference.value<=0||r.target.value<=0)return;
 locked=true;const previousTotal=total,trueFactor=factor(r),error=Math.abs(guessScale-trueFactor)/trueFactor,pts=Math.max(0,Math.round(100*(1-error)));total+=pts;
 const s=sizeFor(r.target,base),c=center();actual.style.width=s.w*trueFactor+'px';actual.style.height=s.h*trueFactor+'px';actual.style.display='flex';positionActual();
 $('lock').disabled=true;$('result').classList.add('show');
 const estimatedValue=r.reference.value*(r.dimension==='Fläche'?guessScale*guessScale:guessScale),difference=Math.abs(estimatedValue-r.target.value);
 $('result').innerHTML='<div class="resulttop"><div class="points"><span id="roundPoints">0</span><small> / 100</small></div><div><h2>Dein Ergebnis</h2><p>Deine Schätzung: <b>'+formatMeasure(estimatedValue,r.reference.unit,r.dimension)+'</b></p><p>Tatsächliche Größe: <b>'+formatMeasure(r.target.value,r.target.unit,r.dimension)+'</b></p><p>Unterschied: <b>'+formatMeasure(difference,r.target.unit,r.dimension)+'</b></p><p>Gesamt: <b><span id="totalPoints">'+previousTotal+'</span> Punkte</b></p></div></div><div class="nextrow"><button id="next">'+(index===rounds.length-1?'Gesamtergebnis':'Nächste Runde')+' →</button></div>';
 $('score').innerHTML='RUNDE '+(index+1)+' / '+rounds.length+' <b>'+total+' PUNKTE</b>';
 animateNumber($('roundPoints'),0,pts,950);animateNumber($('totalPoints'),previousTotal,total,1100);
 $('next').onclick=()=>{if(index<rounds.length-1){index++;render()}else{$('result').innerHTML='<div class="resulttop"><div class="points"><span id="finalPoints">0</span><small> Punkte</small></div><div><h2>MEGASIZE abgeschlossen! 🏆</h2><p>Deine Gesamtpunktzahl aus '+rounds.length+' Runden.</p></div></div><div class="nextrow"><button id="again">Nochmal spielen</button></div>';animateNumber($('finalPoints'),0,total,1300);$('again').onclick=()=>{index=0;total=0;render()}}};
};
render();window.addEventListener('resize',()=>{if(!locked)render()});
})();
</script>


</body></html>
