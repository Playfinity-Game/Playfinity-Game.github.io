<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MEGASIZE – Test</title>
<style>
:root{color-scheme:dark;--bg:#080b18;--panel:#11182b;--cyan:#00eaff;--pink:#ff3d78;--muted:#9aa8c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18284a,#080b18 55%);color:#f4f7ff;font:15px system-ui,sans-serif;min-height:100vh}header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263653;background:#080d1bcc;position:sticky;top:0;z-index:5}h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:2px;color:var(--cyan)}.score{font-weight:800;color:#ffd66b}.wrap{max-width:1100px;margin:auto;padding:18px}.intro{text-align:center;color:var(--muted);margin:4px 0 16px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #36506f;background:#182640;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:linear-gradient(120deg,#00d9ef,#1685ff);color:#04111e;border:0;padding:13px 25px}.board-shell{border:1px solid #2c4568;border-radius:18px;overflow:hidden;background:#0b1222;box-shadow:0 18px 55px #0008}.board{height:min(62vh,540px);min-height:330px;position:relative;overflow:hidden;touch-action:none;background-color:#0c1629;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:32px 32px}.ground{position:absolute;left:0;right:0;bottom:14%;height:2px;background:#9ab1c9aa}.world{position:absolute;inset:0;transform-origin:0 0}.obj{position:absolute;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}.obj svg{width:100%;height:100%;overflow:visible}.obj svg *{fill:currentColor}.reference{color:#168dff;filter:drop-shadow(0 0 8px #168dff55)}.guess{color:#ff3d78;filter:drop-shadow(0 0 8px #ff3d7855);cursor:grab}.guess:active{cursor:grabbing}.meta{display:flex;justify-content:space-between;gap:14px;padding:14px;flex-wrap:wrap}.meta strong{display:block}.muted{color:var(--muted);font-size:.88rem}.lockrow{display:flex;justify-content:flex-end;padding:0 14px 14px}.result{display:none;margin:0 14px 14px;padding:14px;border:1px solid #3e6382;border-radius:12px;background:#0d2032}.result.show{display:block}.result h2{margin:0 0 8px;color:#ffd66b}.nextrow{display:flex;justify-content:flex-end;margin-top:12px}.hint{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px 12px}.zoomlabel{align-self:center;color:var(--muted);font-size:.8rem;min-width:52px;text-align:center}@media(max-width:600px){.wrap{padding:10px}.board{height:55vh;min-height:300px}.meta{font-size:.92rem}.lockrow button{width:100%}}
</style></head><body>
<header><h1>MEGASIZE</h1><div class="score" id="score">Runde 1/3 · 0 Punkte</div></header>
<main class="wrap"><p class="intro">Schätze die Größe! Ziehe und skaliere das rote Objekt. Der Zoom verändert nur die Ansicht.</p>
<div class="toolbar"><button id="zoomOut" aria-label="Herauszoomen">−</button><span class="zoomlabel" id="zoomValue">100 %</span><button id="zoomIn" aria-label="Hineinzoomen">+</button><button id="resetView">Ansicht zurücksetzen</button></div>
<section class="board-shell"><div class="board" id="board"><div class="ground"></div><div class="world" id="world"><div class="obj reference" id="reference"></div><div class="obj guess" id="guess"></div></div></div>
<div class="meta"><div><strong id="referenceName">Referenz</strong><span class="muted" id="targetName">Gesucht</span></div><div><strong id="dimension">Dimension</strong><span class="muted">Vergleichsdimension</span></div></div>
<div class="lockrow"><button class="primary" id="lock">LOCK IN</button></div><div class="result" id="result"></div></section>
<p class="hint">Touch: rotes Objekt ziehen · zum Skalieren zwei Finger auseinander/zusammen oder Mausrad verwenden.</p></main>
<script src="./data.js"></script><script>
(()=>{const rounds=window.MEGASIZE_DATA;let index=0,total=0,zoom=1,locked=false,guessScale=1,guessX=0,guessY=0,baseRef=150,baseGuess=100,drag=null,pinch=null;const $=id=>document.getElementById(id),board=$('board'),world=$('world'),ref=$('reference'),guess=$('guess');function center(){return {x:board.clientWidth/2,y:board.clientHeight*.62}}function render(){const r=rounds[index],c=center();$('referenceName').textContent='Referenz: '+r.reference.name;$('targetName').textContent='Gesucht: '+r.target.name;$('dimension').textContent='Dimension: '+r.dimension;$('score').textContent='Runde '+(index+1)+'/'+rounds.length+' · '+total+' Punkte';ref.innerHTML=r.reference.svg;guess.innerHTML=r.target.svg;ref.style.width=baseRef+'px';ref.style.height=(r.dimension==='Fläche'?baseRef*.68:baseRef*1.45)+'px';ref.style.left=(c.x-baseRef-24)+'px';ref.style.top=(c.y-(parseFloat(ref.style.height)))+'px';baseGuess=r.dimension==='Fläche'?baseRef*.68:baseRef*1.45;guessScale=1;guessX=c.x+30;guessY=c.y-baseGuess;locked=false;guess.style.width=baseGuess+'px';guess.style.height=(r.dimension==='Fläche'?baseGuess*.68:baseGuess)+'px';$('result').classList.remove('show');$('result').innerHTML='';$('lock').disabled=false;applyGuess();applyZoom()}function applyGuess(){guess.style.left=guessX+'px';guess.style.top=guessY+'px';guess.style.width=(baseGuess*guessScale)+'px';guess.style.height=((rounds[index].dimension==='Fläche'?baseGuess*.68:baseGuess)*guessScale)+'px'}function applyZoom(){world.style.transform='scale('+zoom+')';$('zoomValue').textContent=Math.round(zoom*100)+' %'}function point(e){const b=board.getBoundingClientRect();return{x:(e.clientX-b.left)/zoom,y:(e.clientY-b.top)/zoom}}guess.addEventListener('pointerdown',e=>{if(locked)return;e.preventDefault();guess.setPointerCapture(e.pointerId);const p=point(e);drag={x:p.x-guessX,y:p.y-guessY};});guess.addEventListener('pointermove',e=>{if(!drag||locked)return;const p=point(e);guessX=p.x-drag.x;guessY=p.y-drag.y;applyGuess()});guess.addEventListener('pointerup',()=>drag=null);guess.addEventListener('pointercancel',()=>drag=null);board.addEventListener('wheel',e=>{if(locked)return;e.preventDefault();if(e.target.closest('#guess')){guessScale=Math.max(.08,Math.min(12,guessScale*(e.deltaY<0?1.08:.92)));applyGuess()}},{passive:false});$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom*1.2);applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(.35,zoom/1.2);applyZoom()};$('resetView').onclick=()=>{zoom=1;applyZoom()};$('lock').onclick=()=>{if(locked)return;locked=true;const r=rounds[index],estimated=(r.reference.value/r.reference.value)*(baseGuess*guessScale/baseRef)*r.reference.value;const trueRatio=r.target.value/r.reference.value;const estimateRatio=(baseGuess*guessScale)/baseRef;const error=Math.abs(estimateRatio-trueRatio)/trueRatio;const pts=Math.max(0,Math.round(100*Math.max(0,1-error)));total+=pts;const actualPx=baseRef*trueRatio;guessScale=actualPx/baseGuess;guessX=center().x+30;guessY=center().y-(r.dimension==='Fläche'?actualPx*.68:actualPx);applyGuess();$('lock').disabled=true;$('result').classList.add('show');$('result').innerHTML='<h2>'+pts+' / 100 Punkte</h2><p>Referenz: <b>'+r.reference.value.toLocaleString('de-DE')+' '+r.reference.unit+'</b></p><p>'+r.target.name+': <b>'+r.target.value.toLocaleString('de-DE')+' '+r.target.unit+'</b></p><p>Abweichung: '+(error*100).toFixed(1).replace('.',',')+' %</p><div class="nextrow"><button id="next">'+(index===rounds.length-1?'Durchgang beenden':'Nächste Runde')+' →</button></div>';$('score').textContent='Runde '+(index+1)+'/'+rounds.length+' · '+total+' Punkte';$('next').onclick=()=>{if(index<rounds.length-1){index++;render()}else{$('result').innerHTML='<h2>Durchgang geschafft! 🏆</h2><p>Gesamtpunktzahl: <b>'+total+' Punkte</b></p><div class="nextrow"><button id="again">Nochmal spielen</button></div>';$('again').onclick=()=>{index=0;total=0;render()}}}};render()})();
</script></body></html>
