<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#070814"><title>PLAYFINITY Stream</title><style>
:root{color-scheme:dark;--cyan:#00f0ff;--pink:#ff007f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070814;color:#f4f6ff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 15% 15%,#b026ff20,transparent 40%),radial-gradient(circle at 85% 85%,#00f0ff18,transparent 42%),#070814}.toolbar{min-height:48px;display:flex;align-items:center;justify-content:center;gap:9px;padding:7px 12px;flex-wrap:wrap;background:#0a0c1cf2;border-bottom:1px solid #00f0ff35}.toolbar label{font-size:12px;color:#aab2d0;font-weight:700}select,button{font:600 13px system-ui;color:#fff;background:#151a35;border:1px solid #00f0ff55;border-radius:8px;padding:7px 10px}button{cursor:pointer}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame{height:100%;width:auto;max-width:100%;aspect-ratio:9/16;display:flex;flex-direction:column;min-width:0;min-height:0;background:#070814;overflow:hidden;box-shadow:0 0 35px #0009}.brandbar{flex:0 0 auto;min-height:54px;padding:7px 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(110deg,#0b1830,#17102a 60%,#250d25);border-bottom:1px solid #00f0ff66}.brand{font-size:clamp(17px,3vw,24px);font-weight:1000;letter-spacing:.18em;background:linear-gradient(110deg,var(--cyan),#b026ff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.game-name{font-size:11px;font-weight:800;letter-spacing:.12em;color:#d9e5ff;margin-top:2px;text-transform:uppercase}iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:#070814}.scorebar{flex:0 0 auto;min-height:55px;display:flex;align-items:center;justify-content:center;padding:7px 12px;background:linear-gradient(110deg,#10162c,#21102c);border-top:1px solid #ff007f66;text-align:center}.score-label{font-size:10px;font-weight:800;letter-spacing:.13em;color:#c5cce4}.score-value{font-size:clamp(17px,3vw,23px);font-weight:1000;color:var(--cyan)}.hide-brand .brandbar,.hide-score .scorebar,.toolbar-hidden .toolbar{display:none}.wide .frame{width:100%;height:auto;max-height:100%;aspect-ratio:16/9}.free .frame{width:100%;height:100%;aspect-ratio:auto}@media(max-aspect-ratio:3/4){.frame{width:100%;height:100%;aspect-ratio:9/16}}
</style></head><body class="portrait"><div class="toolbar"><label for="format">FORMAT</label><select id="format"><option value="portrait">9:16 · Hochkant</option><option value="wide">16:9 · Querformat</option><option value="free">Flexibel · Fläche füllen</option></select><label><input id="showBrand" type="checkbox" checked> Kopfzeile</label><label><input id="showScore" type="checkbox" checked> Punktebereich</label><button id="hideControls">Steuerung ausblenden</button></div><main class="stage"><section class="frame"><header class="brandbar"><div class="brand">PLAYFINITY</div><div class="game-name" id="gameName">SPIEL WIRD GELADEN</div></header><iframe id="game" title="PLAYFINITY Spiel" src="/?stream=1#menu" allow="autoplay"></iframe><footer class="scorebar"><div><div class="score-label">PUNKTE DER AKTUELLEN RUNDE</div><div class="score-value">IM SPIEL</div></div></footer></section></main>
<script>
const body=document.body,game=document.getElementById('game'),gameName=document.getElementById('gameName');document.getElementById('format').addEventListener('change',e=>{body.classList.remove('portrait','wide','free');body.classList.add(e.target.value)});document.getElementById('showBrand').addEventListener('change',e=>body.classList.toggle('hide-brand',!e.target.checked));document.getElementById('showScore').addEventListener('change',e=>body.classList.toggle('hide-score',!e.target.checked));document.getElementById('hideControls').addEventListener('click',()=>{body.classList.add('toolbar-hidden');const b=document.createElement('button');b.textContent='⚙';b.title='Stream-Ansicht einstellen';b.style.cssText='position:fixed;z-index:20;right:10px;top:10px;opacity:.22';b.onclick=()=>{body.classList.remove('toolbar-hidden');b.remove()};body.appendChild(b)});function updateTitle(){try{const d=game.contentDocument,a=d.querySelector('.screen.active');if(!a)return;const t=a.querySelector('.screen-game-title,h1,h2,.hero-title h1,.card-title');gameName.textContent=(t?.innerText||a.id.replace(/^screen-/,'').replace(/-/g,' ')).trim()||'PLAYFINITY LIVE'}catch(_){}}game.addEventListener('load',()=>{updateTitle();try{const d=game.contentDocument,s=d.createElement('style');s.textContent='body.stream-mode header{display:none!important}body.stream-mode main{min-height:0;height:100%;overflow:auto}body.stream-mode .screen{max-width:none!important;width:100%!important;min-height:100%;padding:clamp(8px,2.2vw,18px)!important}body.stream-mode .screen.active{flex:1}body.stream-mode .hero-title{margin:8px 0 14px}body.stream-mode .hero-title h1{font-size:clamp(1.7rem,5vw,3rem)}body.stream-mode .arcade-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}body.stream-mode .game-card{padding:14px;min-height:130px}body.stream-mode .pf-text-frame{display:none!important}';d.head.appendChild(s);new MutationObserver(updateTitle).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});setInterval(updateTitle,800)}catch(_){}});</script></body></html>
