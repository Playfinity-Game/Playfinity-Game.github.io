<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#070814"><title>PLAYFINITY Stream</title>
<style>
:root{color-scheme:dark;--cyan:#00f0ff;--pink:#ff007f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070814;color:#f4f6ff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 15% 15%,#b026ff20,transparent 40%),radial-gradient(circle at 85% 85%,#00f0ff18,transparent 42%),#070814}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame{height:100%;width:auto;max-width:100%;aspect-ratio:9/16;display:flex;flex-direction:column;min-width:0;min-height:0;background:#070814;overflow:hidden;box-shadow:0 0 35px #0009}.brandbar{flex:0 0 auto;min-height:54px;padding:7px 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(110deg,#0b1830,#17102a 60%,#250d25);border-bottom:1px solid #00f0ff66}.brand{font-size:clamp(17px,3vw,24px);font-weight:1000;letter-spacing:.18em;background:linear-gradient(110deg,var(--cyan),#b026ff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.game-name{font-size:11px;font-weight:800;letter-spacing:.12em;color:#d9e5ff;margin-top:2px;text-transform:uppercase}iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:#070814}.scorebar{flex:0 0 auto;min-height:55px;display:flex;align-items:center;justify-content:center;padding:7px 12px;background:linear-gradient(110deg,#10162c,#21102c);border-top:1px solid #ff007f66;text-align:center}.score-label{font-size:10px;font-weight:800;letter-spacing:.13em;color:#c5cce4}.score-value{font-size:clamp(17px,3vw,23px);font-weight:1000;color:var(--cyan)}.hide-score .scorebar{display:none}.wide .frame{width:min(100%,calc(100vh*16/9));height:min(100%,calc(100vw*9/16));aspect-ratio:16/9}.free .frame{width:100%;height:100%;aspect-ratio:auto}
</style></head>
<body class="portrait"><main class="stage"><section class="frame"><header class="brandbar"><div class="brand">PLAYFINITY</div><div class="game-name" id="gameName">SPIEL WIRD GELADEN</div></header><iframe id="game" title="PLAYFINITY Spiel" src="/?stream=1#menu" allow="autoplay"></iframe><footer class="scorebar"><div><div class="score-label">PUNKTE DER AKTUELLEN RUNDE</div><div class="score-value" id="scoreValue">IM SPIEL</div></div></footer></section></main>
<script>
const API='https://playfinity-game-github-io.onrender.com',body=document.body,game=document.getElementById('game'),gameName=document.getElementById('gameName');let sourceSocket=null;
function applyView(v){if(!v)return;const f=['portrait','wide','free'].includes(v.format)?v.format:'portrait';body.classList.remove('portrait','wide','free');body.classList.add(f);body.classList.toggle('hide-score',v.showScore===false);if(v.game&&['menu','wordle','wordfinity','sizeitup','hangmann','priceisright'].includes(v.game)){try{if(game.contentWindow.PlayfinityRouter&&game.contentWindow.PlayfinityRouter.currentScreen!==v.game)game.contentWindow.PlayfinityRouter.go(v.game)}catch(_){}}}
async function connectSource(){try{const r=await fetch(API+'/api/stream-source/register',{method:'POST'});const d=await r.json();if(!r.ok||!d.websocketPath)throw new Error('Streamquelle konnte nicht registriert werden');sourceSocket=new WebSocket(API.replace(/^https:/,'wss:')+d.websocketPath);sourceSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='view')applyView(m.view)}catch(_){}};sourceSocket.onclose=()=>setTimeout(connectSource,4000)}catch(e){setTimeout(connectSource,5000)}}
function updateTitle(){try{const d=game.contentDocument,a=d.querySelector('.screen.active');if(!a)return;const t=a.querySelector('.screen-game-title,h1,h2,.hero-title h1,.card-title');gameName.textContent=(t?.innerText||a.id.replace(/^screen-/,'').replace(/-/g,' ')).trim()||'PLAYFINITY LIVE'}catch(_){}}
game.addEventListener('load',()=>{updateTitle();try{const d=game.contentDocument,s=d.createElement('style');s.textContent='body.stream-mode header{display:none!important}body.stream-mode main{min-height:0;height:100%;overflow:auto}body.stream-mode .screen{max-width:none!important;width:100%!important;min-height:100%;padding:clamp(8px,2.2vw,18px)!important}body.stream-mode .screen.active{flex:1}body.stream-mode .hero-title{margin:8px 0 14px}body.stream-mode .hero-title h1{font-size:clamp(1.7rem,5vw,3rem)}body.stream-mode .arcade-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}body.stream-mode .game-card{padding:14px;min-height:130px}body.stream-mode .pf-text-frame{display:none!important}';d.head.appendChild(s);new MutationObserver(updateTitle).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});setInterval(updateTitle,1000)}catch(_){}}); 
connectSource();
</script></body></html>
