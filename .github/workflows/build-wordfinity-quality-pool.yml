name: Build WORDFINITY quality candidate pool

on:
  pull_request:
    paths:
      - ".github/workflows/build-wordfinity-quality-pool.yml"
      - "scripts/build_wordfinity_quality_pool.py"
      - "tests/test_wordfinity_quality_pool.py"
      - "data/wordfinity-excluded-words.txt"
      - "data/WORDFINITY-QUALITY-POOL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run strict noun filter tests
        run: python3 -m unittest discover -s tests -p 'test_wordfinity_quality_pool.py'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Leipzig frequency corpus
        run: |
          curl --fail --location --retry 3 \
            https://downloads.wortschatz-leipzig.de/corpora/deu_news_2023_1M.tar.gz \
            --output /tmp/deu_news_2023_1M.tar.gz
      - name: Install German POS tagger
        run: |
          python3 -m pip install --upgrade pip spacy
          python3 -m spacy download de_core_news_sm
      - name: Build strict noun candidate pool
        run: |
          python3 scripts/build_wordfinity_quality_pool.py \
            /tmp/deu_news_2023_1M.tar.gz
      - name: Show generated summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/wordfinity-quality-candidates.json").read_text(encoding="utf-8"))
          print(json.dumps(data["counts"], ensure_ascii=False, indent=2))
          print("Nomen-Beispiele:", ", ".join(data["nouns"][:30]))
          PY
      - name: Upload noun candidate pool for review
        uses: actions/upload-artifact@v4
        with:
          name: wordfinity-strict-nouns
          path: data/wordfinity-quality-candidates.json
          if-no-files-found: error
          retention-days: 30
