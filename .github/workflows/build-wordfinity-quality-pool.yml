name: Build WORDFINITY strict noun list

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wordfinity-quality-pool.yml"
      - "scripts/build_wordfinity_quality_pool.py"
      - "tests/test_wordfinity_quality_pool.py"
      - "data/wordfinity-excluded-words.txt"
      - "data/WORDFINITY-QUALITY-POOL.md"
  pull_request:
    paths:
      - ".github/workflows/build-wordfinity-quality-pool.yml"
      - "scripts/build_wordfinity_quality_pool.py"
      - "tests/test_wordfinity_quality_pool.py"
      - "data/wordfinity-excluded-words.txt"
      - "data/WORDFINITY-QUALITY-POOL.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run strict noun filter tests
        run: python3 -m unittest discover -s tests -p 'test_wordfinity_quality_pool.py'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Leipzig frequency corpus
        run: |
          curl --fail --location --retry 3 \
            https://downloads.wortschatz-leipzig.de/corpora/deu_news_2023_1M.tar.gz \
            --output /tmp/deu_news_2023_1M.tar.gz
      - name: Install German POS tagger
        run: |
          python3 -m pip install --upgrade pip spacy
          python3 -m spacy download de_core_news_sm
      - name: Build strict noun candidate pool
        run: |
          python3 scripts/build_wordfinity_quality_pool.py \
            /tmp/deu_news_2023_1M.tar.gz
      - name: Publish strict nouns as the active WORDFINITY dictionary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("data/wordfinity-quality-candidates.json").read_text(encoding="utf-8"))
          nouns = candidates["nouns"]
          if len(nouns) < 1000:
              raise SystemExit(f"Abbruch: nur {len(nouns)} Nomen; aktive Wortliste bleibt unverändert.")
          Path("data/wordfinity-nouns.json").write_text(
              json.dumps(nouns, ensure_ascii=False, separators=(",", ":")) + "\\n",
              encoding="utf-8"
          )
          print(f"Aktive WORDFINITY-Wortliste: {len(nouns)} streng gefilterte Nomen.")
          PY
      - name: Upload strict noun lists and count for review
        uses: actions/upload-artifact@v4
        with:
          name: wordfinity-strict-nouns
          path: |
            data/wordfinity-quality-candidates.json
            data/wordfinity-nouns.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit active dictionary to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wordfinity-nouns.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WORDFINITY with strictly filtered nouns"
            git push
          else
            echo "Die aktive Nomenliste ist bereits aktuell."
          fi
