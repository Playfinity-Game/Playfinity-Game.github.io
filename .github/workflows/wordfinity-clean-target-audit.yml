name: Wordfinity clean target audit

on:
  push:
    branches:
      - wordfinity-hf-semantic-overhaul-2026-11-15
    paths:
      - ".github/workflows/wordfinity-clean-target-audit.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-existing-target-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: wordfinity-hf-semantic-overhaul-2026-11-15

      # Reuse the already completed audit artifact. No spaCy, Leipzig corpus,
      # OpenThesaurus, pip packages, or fresh analysis downloads.
      - name: Download existing audit artifact
        uses: actions/download-artifact@v4
        with:
          name: wordfinity-clean-target-audit
          path: /tmp/wordfinity-audit
          repository: Playfinity-Game/Playfinity-Game.github.io
          run-id: 43664715070
          github-token: ${{ github.token }}

      - name: Publish the existing 8,213-word accepted cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("/tmp/wordfinity-audit/wordfinity-endungsfilter.json")
          report = json.loads(source.read_text(encoding="utf-8"))
          words = report["accepted_kept"]
          if len(words) != 8213 or len({word.casefold() for word in words}) != 8213:
              raise SystemExit(f"Expected exactly 8,213 unique words, got {len(words)}")
          target = Path("data/wordfinity-targets.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(words, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared {len(words)} existing target words.")
          PY

      - name: Commit target list to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wordfinity-targets.json
          git diff --cached --quiet || git commit -m "Add existing curated 8,213-word Wordfinity target list"
          git push
