name: Generate MEGASIZE country silhouettes
on:
  push:
    branches: [main]
    paths:
      - 'assets/silhouettes/natural-earth/ne_10m_admin_0_countries.zip'
      - 'scripts/generate-country-silhouettes.py'
      - '.github/workflows/generate-country-silhouettes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyshp
      - name: Generate SVG files
        run: python scripts/generate-country-silhouettes.py assets/silhouettes/natural-earth/ne_10m_admin_0_countries.zip
      - name: Commit generated silhouettes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/silhouettes/countries
          if ! git diff --cached --quiet; then
            git commit -m "Generate MEGASIZE country silhouette SVGs"
            git push
          fi
