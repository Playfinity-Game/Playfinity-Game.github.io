name: Build Wordfinity semantic hint ranks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wordfinity-hint-ranks.yml"
      - "scripts/build_wordfinity_hint_ranks.py"
      - "scripts/requirements-hint-ranks.txt"
      - "data/wordfinity-nouns.json"

permissions:
  contents: write

concurrency:
  group: wordfinity-hint-rank-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-hint-ranks.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r scripts/requirements-hint-ranks.txt

      - name: Check generator syntax
        run: python -m py_compile scripts/build_wordfinity_hint_ranks.py

      - name: Build semantic ranks
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/build_wordfinity_hint_ranks.py \
            --targets data/wordfinity-nouns.json \
            --output build/wordfinity-hint-ranks \
            --candidate-count 15500 \
            --batch-size 32

      - name: Validate manifest and target dictionary fingerprint
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          target_path = Path("data/wordfinity-nouns.json")
          manifest_path = Path("build/wordfinity-hint-ranks/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = hashlib.sha256(target_path.read_bytes()).hexdigest()
          assert manifest["format"] == "wordfinity-semantic-ranks-v1"
          assert manifest["targetDictionarySha256"] == expected
          assert manifest["targetCount"] == len(manifest["rankings"])
          assert manifest["candidateCount"] == len(manifest["candidateWords"])
          assert len(manifest["candidateWords"]) <= 65535
          assert len({word.lower() for word in manifest["candidateWords"]}) == len(manifest["candidateWords"])
          for target, entry in manifest["rankings"].items():
              rank_file = manifest_path.parent / entry["file"]
              assert rank_file.is_file(), f"Missing rank file for {target}"
              assert hashlib.sha256(rank_file.read_bytes()).hexdigest() == entry["sha256"]
          print(
              f"Validated {manifest['targetCount']} targets and "
              f"{manifest['candidateCount']} candidates; dictionary SHA-256 matches."
          )
          PY

      - name: Upload generated rank data
        uses: actions/upload-artifact@v4
        with:
          name: wordfinity-semantic-hint-ranks
          path: build/wordfinity-hint-ranks/
          if-no-files-found: error
          retention-days: 90

      - name: Publish online rank data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wordfinity-rank-data"
          cp -R build/wordfinity-hint-ranks/. "$RUNNER_TEMP/wordfinity-rank-data/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan wordfinity-rank-data
          git rm -rf . || true
          rm -rf build
          cp -R "$RUNNER_TEMP/wordfinity-rank-data/." .
          git add -A
          git commit -m "Publish Wordfinity semantic rank data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/wordfinity-rank-data --force
