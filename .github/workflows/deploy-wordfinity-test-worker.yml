name: Deploy Wordfinity Test Cloudflare Worker

on:
  push:
    branches:
      - wordfinity-test-singular-word-batch-1
      - wordfinity-test-live-rank-cpu-fix
      - wordfinity-test-mobile-submit-reliability
    paths:
      - "cloudflare/wordfinity-ai-test/**"
      - ".github/workflows/deploy-wordfinity-test-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy isolated test worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare/wordfinity-ai-test"
          command: deploy
