name: Generate MEGASIZE continent and island-group silhouettes
on:
  push:
    branches: [main]
    paths:
      - 'assets/silhouettes/natural-earth/ne_10m_admin_0_countries.zip'
      - 'assets/silhouettes/natural-earth/ne_10m_land.zip'
      - 'scripts/generate-region-silhouettes.py'
      - '.github/workflows/generate-region-silhouettes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyshp shapely
      - name: Generate continent and island-group SVGs
        run: python scripts/generate-region-silhouettes.py assets/silhouettes/natural-earth/ne_10m_admin_0_countries.zip assets/silhouettes/natural-earth/ne_10m_land.zip
      - name: Commit generated silhouettes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/silhouettes/regions
          if ! git diff --cached --quiet; then
            git commit -m "Generate MEGASIZE continent and island-group SVGs"
            git push
          fi
