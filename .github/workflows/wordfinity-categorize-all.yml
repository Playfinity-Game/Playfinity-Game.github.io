name: WORDFINITY – alle Wörter kategorisieren

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  categorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kategorien berechnen
        run: |
          npm install --no-save @xenova/transformers@2.17.2
          node scripts/categorize-wordfinity.mjs
      - name: Ergebnis als Pull Request bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automated/wordfinity-category-assignments
          git add data/wordfinity-categories.json data/wordfinity-category-review.json
          if ! git diff --cached --quiet; then
            git commit -m "WORDFINITY: alle Wörter automatisch kategorisieren"
          fi
          git push --force origin automated/wordfinity-category-assignments
          gh pr view automated/wordfinity-category-assignments --repo "${{ github.repository }}" >/dev/null 2>&1 || gh pr create --repo "${{ github.repository }}" --base main --head automated/wordfinity-category-assignments --title "WORDFINITY: alle Wörter Kategorien zuordnen" --body "Automatisch erzeugte Kategorien für das vollständige Wörterbuch mit dem im Spiel verwendeten mehrsprachigen Embedding-Modell. Mehrdeutige oder schwach zugeordnete Wörter stehen zusätzlich in data/wordfinity-category-review.json zur manuellen Kontrolle."
