name: Troll Admin Preview and Security Tests

on:
  push:
    branches:
      - feature/troll-admin-safe-preview
    paths:
      - 'troll-admin-preview.html'
      - 'tiktok-connector/server.js'
      - 'tiktok-connector/troll-admin-auth.js'
      - 'tiktok-connector/troll-admin-state.js'
      - 'tests/troll-admin-preview.spec.cjs'
      - 'tests/troll-admin-auth.spec.js'
      - 'tests/troll-admin-state.spec.js'
      - '.github/workflows/troll-admin-preview-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'troll-admin-preview.html'
      - 'tiktok-connector/server.js'
      - 'tiktok-connector/troll-admin-auth.js'
      - 'tiktok-connector/troll-admin-state.js'
      - 'tests/troll-admin-preview.spec.cjs'
      - 'tests/troll-admin-auth.spec.js'
      - 'tests/troll-admin-state.spec.js'
      - '.github/workflows/troll-admin-preview-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check tiktok-connector/server.js
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit and browser tests
        run: node --test tests/troll-admin-auth.spec.js tests/troll-admin-state.spec.js tests/troll-admin-preview.spec.cjs
